{"@type":"Question","name":"Is cancer contagious?","acceptedAnswer":{"@type":"Answer","text":"No. Cancer cannot pass from one person to another through touch, sharing food, close contact or care. You can support a person with cancer without any risk of catching it."}},
{"@type":"Question","name":"Does finding a lump mean it is cancer?","acceptedAnswer":{"@type":"Answer","text":"No. Most lumps have ordinary causes such as cysts or infections. Only a proper medical examination and tests can tell — which is exactly why any persistent lump should be shown to a doctor rather than worried about silently."}},
{"@type":"Question","name":"What is the difference between screening and diagnosis?","acceptedAnswer":{"@type":"Answer","text":"Screening looks for possible changes before any symptoms appear, in people who feel well. Diagnosis is the process of finding out what is causing a sign or symptom that has already appeared. Both are done by medical professionals."}},
{"@type":"Question","name":"Is cancer always hereditary?","acceptedAnswer":{"@type":"Answer","text":"No. Only a small proportion of cancers run strongly in families. Most occur due to a combination of factors over time. If cancer does appear more than usual in your family, share that history with a doctor so appropriate checks can be planned."}},
{"@type":"Question","name":"Can healthy habits prevent cancer completely?","acceptedAnswer":{"@type":"Answer","text":"No single habit guarantees prevention, but avoiding tobacco and areca nut, limiting alcohol, staying active, eating well and keeping timely check-ups meaningfully reduce the risk of several cancers and improve general health."}},
