<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BCCO CMS</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #5B176F 0%, #250A2E 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 12px;
      object-fit: contain;
      box-shadow: 0 4px 12px rgba(91, 23, 111, 0.2);
    }
    .login-brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #250A2E;
      margin: 0;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: #718096;
      margin: 4px 0 0 0;
    }
    .demo-credentials-box {
      background: #FAF5FF;
      border: 1px dashed #5B176F;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: #4A1563;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <img src="../assets/images/logo.png" alt="BCCO Logo">
    <h1>BCCO Admin CMS</h1>
    <p>Sign in to manage website content and media</p>
  </div>

  <div class="demo-credentials-box">
    <strong>Admin Control Center Access:</strong><br>
    Username: <code style="background:#fff;padding:2px 4px;border-radius:4px;">admin</code> &bull; Password: <code style="background:#fff;padding:2px 4px;border-radius:4px;">admin123</code>
  </div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label" for="username">Username or Email</label>
      <input type="text" id="username" class="form-control" required autofocus placeholder="admin" value="admin">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" required placeholder="••••••••••••" value="admin123">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem;">
      Sign In to Dashboard &rarr;
    </button>
  </form>

  <div style="margin-top: 24px; text-align: center; border-top: 1px solid #E2E8F0; padding-top: 16px;">
    <a href="../" style="font-size: 0.85rem; color: #5B176F; text-decoration: none; font-weight: 600;">
      &larr; Return to Public Website
    </a>
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;

  if (!u || !p) {
    alert('Please enter username and password');
    return;
  }

  // Store demo login state
  localStorage.setItem('bcco_admin_logged_in', 'true');
  localStorage.setItem('bcco_admin_user', u);

  // Redirect to Dashboard
  window.location.href = 'index.html';
}
</script>

</body>
</html>
