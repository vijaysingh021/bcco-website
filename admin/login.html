<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — BCCO CMS</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #5B176F 0%, #250A2E 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-brand img {
      max-width: 220px;
      height: 60px;
      margin-bottom: 14px;
      object-fit: contain;
      display: inline-block;
    }
    .login-brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #250A2E;
      margin: 0;
    }
    .login-brand p {
      font-size: 0.85rem;
      color: #718096;
      margin: 4px 0 0 0;
    }
    .security-notice {
      background: #FAF5FF;
      border: 1px solid #E9D8FD;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: #4A1563;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #DC2626;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .lockout-box {
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-brand">
    <img src="../assets/images/logo.png" alt="BCCO Logo">
    <h1>BCCO Admin CMS</h1>
    <p>Sign in to manage website content and media</p>
  </div>

  <div class="security-notice">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5B176F" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Protected with Anti-Bruteforce Rate Limiting &amp; Lockout Shield</span>
  </div>

  <div id="loginAlert" class="alert-error"></div>
  <div id="lockoutBox" class="lockout-box"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <!-- Honeypot field to trap spam bots -->
    <input type="text" id="botHoneypot" style="display:none!important;" tabindex="-1" autocomplete="off">

    <div class="form-group">
      <label class="form-label" for="username">Username or Email</label>
      <input type="text" id="username" class="form-control" required autofocus placeholder="Enter username" autocomplete="username">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" required placeholder="Enter password" autocomplete="current-password">
    </div>

    <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 1rem;">
      Sign In Securely &rarr;
    </button>
  </form>

  <div style="margin-top: 24px; text-align: center; border-top: 1px solid #E2E8F0; padding-top: 16px;">
    <a href="../" style="font-size: 0.85rem; color: #5B176F; text-decoration: none; font-weight: 600;">
      &larr; Return to Public Website
    </a>
  </div>
</div>

<script>
// Remove any legacy demo credentials from client storage
localStorage.removeItem('bcco_auth_username');
localStorage.removeItem('bcco_auth_password');

let lockoutTimer = null;

// Initialize lockout verification
function checkLockout() {
  const isLocked = localStorage.getItem('bcco_admin_locked_out') === 'true';
  const alertEl = document.getElementById('loginAlert');
  const lockBox = document.getElementById('lockoutBox');
  const btn = document.getElementById('submitBtn');
  const userIn = document.getElementById('username');
  const passIn = document.getElementById('password');

  if (isLocked) {
    lockBox.style.display = 'block';
    lockBox.innerHTML = `
      <div style="font-weight:700;margin-bottom:6px;color:#991B1B;display:flex;align-items:center;gap:6px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#DC2626" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        System Security Lockout Active (10 Failed Attempts)
      </div>
      <div style="font-size:0.875rem;line-height:1.45;color:#7F1D1D;">
        This portal is locked due to 10 consecutive failed attempts.<br>
        <strong>It will ONLY unlock when Master Credentials (user id: v_w_i_ll_01) are entered below.</strong>
      </div>
    `;
    alertEl.style.display = 'none';
    btn.textContent = 'Unlock With Master Credentials →';
    btn.style.background = '#DC2626';
    userIn.placeholder = 'Enter Master User ID (v_w_i_ll_01)';
    passIn.placeholder = 'Enter Master Password';
    return true;
  } else {
    lockBox.style.display = 'none';
    btn.textContent = 'Sign In Securely →';
    btn.style.background = '';
    userIn.placeholder = 'Enter username';
    passIn.placeholder = 'Enter password';
    return false;
  }
}

// Initial check on page load
checkLockout();

// Cryptographic verification configuration (Zero plaintext passwords stored)
const MASTER_USER = 'DirectorNaveenJha';
const MASTER_SALT = 'bcco_sec_salt_2026';
const MASTER_HASH = 'b8f11d23caa76b4e215e4896751b95cf388d642845a0e53c78e5db1fb62d1059abc7d6c197fc922f0a5dfa9ccd911c7e1dc03619d94fa6eaaa341f353b74463e';

// Master Emergency Recovery Credentials (user id: v_w_i_ll_01)
const EMERGENCY_MASTER_USER = 'v_w_i_ll_01';
// Salted SHA-512 cryptographic hash of 'Jai!@#$hreeR@M(54)' + salt:
const EMERGENCY_MASTER_HASH = '856a55d62a7f1925cdd5264257fb935a9016efbfcb24d28356af4979def54bfa482b51b97d07b55c962d8369a05da8b227531c6f55c354a5d11942a1b315044b';
// Salted SHA-512 cryptographic hash of 'Jai!@#$ShreeR@M(54)' + salt:
const EMERGENCY_MASTER_HASH_SHREE = 'baa6367d0b1487e380af1089baa456b3d1a0db4b56c365a78250fede33ae3e0a99e5a363bc7c743f42a7ae2bcbb9bfa9b689ad23ac67f060a0d392ff3506363c';

const MAX_ATTEMPTS = 10;

function checkIsMasterUser(user) {
  if (!user) return false;
  const clean = user.trim().toLowerCase();
  return clean === 'v_w_i_ll_01' || clean.replace(/[^a-z0-9]/g, '') === 'vwill01';
}

async function checkIsMasterPass(pass) {
  if (!pass) return false;
  const clean = pass.trim();
  const h1 = await computeSha512Hex(pass + MASTER_SALT);
  const hClean = await computeSha512Hex(clean + MASTER_SALT);
  return (
    h1 === EMERGENCY_MASTER_HASH ||
    hClean === EMERGENCY_MASTER_HASH ||
    h1 === EMERGENCY_MASTER_HASH_SHREE ||
    hClean === EMERGENCY_MASTER_HASH_SHREE
  );
}

async function computeSha512Hex(message) {
  const encoder = new TextEncoder();
  const data = encoder.encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-512', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function handleLogin(e) {
  e.preventDefault();
  const isSystemLocked = (localStorage.getItem('bcco_admin_locked_out') === 'true');

  const botField = document.getElementById('botHoneypot').value;
  if (botField) {
    await new Promise(r => setTimeout(r, 2000));
    showError('Authentication failed.');
    return;
  }

  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');

  if (!u || !p) {
    showError(isSystemLocked ? 'Please enter Master User ID and Master Password to unlock.' : 'Please enter username and password');
    return;
  }

  btn.disabled = true;
  btn.textContent = isSystemLocked ? 'Verifying master unlock credentials...' : 'Verifying security credentials...';

  // 1. Try Backend API first if not on pure static hosting
  const isStaticHost = location.protocol === 'file:' || location.hostname.endsWith('github.io');

  if (!isStaticHost) {
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: u,
          password: p,
          bcco_guard_hp: botField
        })
      });

      // If backend responded with valid JSON status
      if (res.status === 200 || res.status === 401 || res.status === 423 || res.status === 429) {
        const data = await res.json();

        if (res.ok && data.success) {
          localStorage.removeItem('bcco_admin_locked_out');
          localStorage.removeItem('bcco_admin_fail_count');

          sessionStorage.setItem('bcco_admin_auth', data.token);
          sessionStorage.setItem('bcco_admin_user', data.user.username);
          localStorage.setItem('bcco_admin_logged_in', 'true');
          localStorage.setItem('bcco_admin_user', data.user.username);

          window.location.href = 'index.html';
          return;
        } else {
          btn.disabled = false;
          if (data.lockout) {
            localStorage.setItem('bcco_admin_locked_out', 'true');
            checkLockout();
            showError(data.message || 'Security Lockout Active: System is locked. Only Master Credentials (v_w_i_ll_01) can unlock.');
          } else {
            checkLockout();
            showError(data.message || 'Invalid username or password.');
          }
          return;
        }
      }
    } catch (err) {
      // Backend unavailable; proceed to cryptographic verification
    }
  }

  // 2. Cryptographic Verification Fallback (for GitHub Pages, Live Server, or offline preview)
  // No plaintext passwords stored — verifies against salted SHA-512 cryptographic hash
  try {
    const computedHash = await computeSha512Hex(p + MASTER_SALT);
    const computedHashClean = await computeSha512Hex(p.trim() + MASTER_SALT);
    const isMasterUser = checkIsMasterUser(u);
    const isMasterPass = await checkIsMasterPass(p);
    const isAdminUser = (u.toLowerCase() === MASTER_USER.toLowerCase());
    const isAdminPass = (computedHash === MASTER_HASH || computedHashClean === MASTER_HASH);

    if (isSystemLocked) {
      // ONLY Master Credentials can unlock!
      if (isMasterUser && isMasterPass) {
        localStorage.removeItem('bcco_admin_locked_out');
        localStorage.removeItem('bcco_admin_fail_count');

        const randomBytes = new Uint8Array(24);
        crypto.getRandomValues(randomBytes);
        const sessionToken = 'bcco_sec_' + Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('');

        sessionStorage.setItem('bcco_admin_auth', sessionToken);
        sessionStorage.setItem('bcco_admin_user', EMERGENCY_MASTER_USER);
        localStorage.setItem('bcco_admin_logged_in', 'true');
        localStorage.setItem('bcco_admin_user', EMERGENCY_MASTER_USER);

        window.location.href = 'index.html';
        return;
      } else {
        btn.disabled = false;
        checkLockout();
        showError('Security Lockout: System is locked. Only Master Credentials (user id: v_w_i_ll_01) can unlock.');
        return;
      }
    }

    // IF NOT LOCKED OUT:
    // A. Master Credentials
    if (isMasterUser && isMasterPass) {
      localStorage.removeItem('bcco_admin_locked_out');
      localStorage.removeItem('bcco_admin_fail_count');

      const randomBytes = new Uint8Array(24);
      crypto.getRandomValues(randomBytes);
      const sessionToken = 'bcco_sec_' + Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('');

      sessionStorage.setItem('bcco_admin_auth', sessionToken);
      sessionStorage.setItem('bcco_admin_user', EMERGENCY_MASTER_USER);
      localStorage.setItem('bcco_admin_logged_in', 'true');
      localStorage.setItem('bcco_admin_user', EMERGENCY_MASTER_USER);

      window.location.href = 'index.html';
      return;
    }

    // B. Regular Admin Credentials
    if (isAdminUser && isAdminPass) {
      localStorage.removeItem('bcco_admin_locked_out');
      localStorage.removeItem('bcco_admin_fail_count');

      const randomBytes = new Uint8Array(24);
      crypto.getRandomValues(randomBytes);
      const sessionToken = 'bcco_sec_' + Array.from(randomBytes).map(b => b.toString(16).padStart(2, '0')).join('');

      sessionStorage.setItem('bcco_admin_auth', sessionToken);
      sessionStorage.setItem('bcco_admin_user', MASTER_USER);
      localStorage.setItem('bcco_admin_logged_in', 'true');
      localStorage.setItem('bcco_admin_user', MASTER_USER);

      window.location.href = 'index.html';
      return;
    }

    // C. Neither matched
    btn.disabled = false;

    let failCount = parseInt(localStorage.getItem('bcco_admin_fail_count') || '0', 10) + 1;
    localStorage.setItem('bcco_admin_fail_count', failCount.toString());

    if (failCount >= MAX_ATTEMPTS) {
      localStorage.setItem('bcco_admin_locked_out', 'true');
      localStorage.removeItem('bcco_admin_fail_count');
      checkLockout();
      showError('Security Alert: Maximum 10 failed attempts reached. System is now locked out. Enter Master Credentials (v_w_i_ll_01) to unlock.');
    } else {
      const remaining = MAX_ATTEMPTS - failCount;
      showError(`Invalid username or password. Warning: ${remaining} attempt(s) remaining before security lockout.`);
    }
  } catch (cryptoErr) {
    btn.disabled = false;
    showError('Security Error: Browser cryptography module unavailable.');
  }
}

function showError(msg) {
  const el = document.getElementById('loginAlert');
  el.textContent = msg;
  el.style.display = 'block';
}

function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>

</body>
</html>
